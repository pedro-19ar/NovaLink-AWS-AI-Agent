name: Deploy AWS Agent Pedro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Package Lambda
        run: |
          cd app/lambda
          zip -r lambda.zip .

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Inject API URL into Frontend
        working-directory: infra
        run: |
          API_URL=$(terraform output -raw api_url)
          # Replace the hardcoded API_URL with the dynamic one generated by Terraform
          sed -i "s|const API_URL = \".*\";|const API_URL = \"$API_URL\";|g" ../app/frontend/app.js

      - name: Deploy Frontend to S3
        run: |
          # Use the bucket name defined in infra/main.tf
          aws s3 sync app/frontend/ s3://aws-bucket-ai-agent-pedro --delete
